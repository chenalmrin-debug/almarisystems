  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ort\" style=\"color: #d6e2f2; text-decoration: none\">ליווי<\u002Fa>\n<a href=\"#faq\" style=\"color: #d6e2f2; text-decoration: none\">שאלות<\u002Fa>\n<a href=\"https://www.instagram.com/almarisystems/\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px; background: #ffffff; color: #14213d; font-weight: 700; text-decoration: none\">דברו איתנו<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fheader>\n\n<section style=\"background: #14213d; color: #ffffff\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 72px 24px 96px; display: flex; flex-wrap: wrap; align-items: center; gap: 56px\">\n<div style=\"flex: 999 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n<div style=\"font-size: 15px; font-weight: 700; letter-spacing: 0.12em; color: #8fb8e6\">מערכות לעסקים קטנים ובינוניים<\u002Fdiv>\n<h1 style=\"margin: 0; font-family: 'Secular One', 'Assistant', sans-serif; font-weight: 400; font-size: 54px; line-height: 1.15\">העסק שלכם עובד.<br>המערכת עושה את השאר.<\u002Fh1>\n<p style=\"margin: 0; font-size: 20px; color: #d6e2f2; max-width: 560px\">Almari Systems בונה לעסק שלכם מערכות שעושות את העבודה החוזרת. לא צריך להבין בטכנולוגיה. אנחנו בונים, מטמיעים ונשארים איתכם גם אחרי.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px; align-items: center\">\n<a href=\"https://www.instagram.com/almarisystems/\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; border-radius: 999px; background: {{accent}}; color: #ffffff; font-weight: 700; font-size: 18px; text-decoration: none\">לבדיקת התאמה<\u002Fa>\n<a href=\"#calc\" style=\"display: inline-flex; align-items: center; min-height: 52px; padding: 0 24px; border-radius: 999px; border: 1px solid #5a6f96; color: #ffffff; font-weight: 600; font-size: 18px; text-decoration: none\">כמה זמן אפשר לחסוך?<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex: 1 1 360px; min-width: 0; background: #ffffff; color: #14213d; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 24px 60px rgba(0,0,0,0.35)\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n<div style=\"font-weight: 700; font-size: 17px\">מה קורה כשלקוח פונה<\u002Fdiv>\n<div role=\"group\" aria-label=\"השוואה\" style=\"display: flex; background: #eef4fb; border-radius: 999px; padding: 4px; gap: 4px\">\n<button type=\"button\" sc-camel-on-click=\"{{showManual}}\" aria-pressed=\"{{manualPressed}}\" style=\"min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; font: 700 15px 'Assistant', sans-serif; cursor: pointer; background: {{manualBg}}; color: {{manualFg}}\">היום<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{showAuto}}\" aria-pressed=\"{{autoPressed}}\" style=\"min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; font: 700 15px 'Assistant', sans-serif; cursor: pointer; background: {{autoBg}}; color: {{autoFg}}\">עם Almari<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<ol style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px\">\n<sc-for list=\"{{flow}}\" as=\"item\" hint-placeholder-count=\"4\">\n<li style=\"display: flex; gap: 12px; align-items: flex-start; background: {{item.bg}}; border-radius: 14px; padding: 12px 14px\">\n<div style=\"flex: 0 0 30px; height: 30px; border-radius: 50%; background: {{item.dot}}; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px\">{{item.n}}<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0\">\n<div style=\"font-weight: 700; font-size: 16px\">{{item.title}}<\u002Fdiv>\n<div style=\"font-size: 15px; color: #46546f\">{{item.text}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<div style=\"font-size: 15px; font-weight: 700; color: {{summaryColor}}\">{{summary}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"services\" style=\"background: #ffffff\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 640px\">\n<h2 style=\"margin: 0; font-family: 'Secular One', 'Assistant', sans-serif; font-weight: 400; font-size: 38px; line-height: 1.2\">מה אנחנו בונים.<\u002Fh2>\n<p style=\"margin: 0; color: #46546f\">כל מערכת נבנית לפי איך שהעסק שלכם עובד בפועל. לא תבנית מדף.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px\">\n<div style=\"background: #f5f8fc; border: 1px solid #dbe4f0; border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1f5f9e\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z\"><\u002Fpath><path d=\"M9 11h6M9 14h4\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 20px; font-weight: 700\">מענה אוטומטי ללקוחות<\u002Fh3>\n<p style=\"margin: 0; color: #46546f; font-size: 17px\">תגובה ברשתות או הודעה נכנסת מקבלות מענה מיידי, והפרטים מגיעים אליכם מסודרים.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #f5f8fc; border: 1px solid #dbe4f0; border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1f5f9e\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"M3 10h18M9 10v10\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 20px; font-weight: 700\">ניהול לידים בטבלה אחת<\u002Fh3>\n<p style=\"margin: 0; color: #46546f; font-size: 17px\">כל פנייה נכנסת לטבלה לבד, עם שם, טלפון וסוג הבקשה. בלי להקליד שורה.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #f5f8fc; border: 1px solid #dbe4f0; border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1f5f9e\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z\"><\u002Fpath><path d=\"M14 3v6h6M8 13h8M8 17h5\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 20px; font-weight: 700\">הצעות מחיר ומעקב<\u002Fh3>\n<p style=\"margin: 0; color: #46546f; font-size: 17px\">הצעה נבנית מתבנית ויוצאת בלחיצה. אם אין תשובה, הודעת מעקב יוצאת בזמן.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #f5f8fc; border: 1px solid #dbe4f0; border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1f5f9e\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"M16 3v4M8 3v4M3 11h18M8 15h3M13 15h3\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 20px; font-weight: 700\">סידור משמרות<\u002Fh3>\n<p style=\"margin: 0; color: #46546f; font-size: 17px\">העובדים מגישים זמינות, והסידור נבנה לפי הכללים של העסק. בלי שרשורי וואטסאפ.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"calc\" style=\"background: #eef4fb\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 88px 24px; display: flex; flex-wrap: wrap; gap: 48px; align-items: center\">\n<div style=\"flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<h2 style=\"margin: 0; font-family: 'Secular One', 'Assistant', sans-serif; font-weight: 400; font-size: 38px; line-height: 1.2\">כמה זמן הולך לכם על עבודה ידנית?<\u002Fh2>\n<p style=\"margin: 0; color: #46546f\">הזיזו את הסמן לפי הערכה של השעות בשבוע שהולכות על העתקות, תשובות חוזרות ומעקבים.<\u002Fp>\n<label for=\"hours\" style=\"font-weight: 700; font-size: 17px\">שעות בשבוע: {{hours}}<\u002Flabel>\n<input id=\"hours\" type=\"range\" min=\"1\" max=\"30\" step=\"1\" value=\"{{hours}}\" sc-camel-on-change=\"{{onHours}}\" style=\"width: 100%; min-height: 44px; accent-color: #1f5f9e; cursor: pointer\">\n<\u002Fdiv>\n<div style=\"flex: 1 1 320px; min-width: 0; background: #14213d; color: #ffffff; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 18px\" aria-live=\"polite\">\n<div style=\"font-size: 15px; letter-spacing: 0.1em; color: #8fb8e6; font-weight: 700\">בשנה זה מסתכם ב־<\u002Fdiv>\n<div style=\"font-family: 'Secular One', 'Assistant', sans-serif; font-size: 64px; line-height: 1\">{{yearly}} שעות<\u002Fdiv>\n<div style=\"font-size: 18px; color: #d6e2f2\">כ־{{days}} ימי עבודה מלאים. זמן שאפשר להחזיר לעסק.<\u002Fdiv>\n<a href=\"https://www.instagram.com/almarisystems/\" target=\"_blank\" rel=\"noopener\" style=\"align-self: flex-start; display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; border-radius: 999px; background: #ffffff; color: #14213d; font-weight: 700; text-decoration: none\">בואו נבדוק מה אפשר לחסוך<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"support\" style=\"background: #ffffff\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 680px\">\n<div style=\"font-size: 15px; font-weight: 700; letter-spacing: 0.12em; color: {{accent}}\">בלי ידע טכני<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Secular One', 'Assistant', sans-serif; font-weight: 400; font-size: 38px; line-height: ים. מסבירים מה המערכת עושה ולמה זה חשוב לעסק.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top: 3px solid #14213d; padding-top: 20px; display: flex; flex-direction: column; gap: 8px\">\n<h3 style=\"margin: 0; font-size: 21px; font-weight: 700\">בונים על מה שכבר יש<\u002Fh3>\n<p style=\"margin: 0; color: #46546f\">ככל האפשר, המערכת עובדת עם הכלים שהעסק כבר משתמש בהם.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top: 3px solid #14213d; padding-top: 20px; display: flex; flex-direction: column; gap: 8px\">\n<h3 style=\"margin: 0; font-size: 21px; font-weight: 700\">ליווי גם אחרי ההטמעה<\u002Fh3>\n<p style=\"margin: 0; color: #46546f\">שאלה, תקלה או שינוי בעסק? אנחנו זמינים, מעדכנים ומתאימים את המערכת.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"process\" style=\"background: #f5f8fc\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 40px\">\n<h2 style=\"margin: 0; font-family: 'Secular One', 'Assistant', sans-serif; font-weight: 400; font-size: 38px; line-height: 1.2\">ארבעה שלבים. ואנחנו איתך בכולם.<\u002Fh2>\n<ol style=\"margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px\">\n<li style=\"background: #ffffff; border: 1px solid #dbe4f0; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: 'Secular One', 'Assistant', sans-serif; font-size: 30px; color: #1f5f9e\">01<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 20px; font-weight: 700\">אבחון<\u002Fh3>\n<p style=\"margin: 0; color: #46546f; font-size: 17px\">שאלון התאמה קצר ושיחה. מזהים איפה בדיוק הולך הזמן.<\u002Fp>\n<\u002Fli>\n<li style=\"background: #ffffff; border: 1px solid #dbe4f0; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: 'Secular One', 'Assistant', sans-serif; font-size: 30px; color: #1f5f9e\">02<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 20px; font-weight: 700\">בנייה<\u002Fh3>\n<p style=\"margin: 0; color: #46546f; font-size: 17px\">בונים את המערכת ומראים לכם אותה עובדת לפני שהיא עולה.<\u002Fp>\n<\u002Fli>\n<li style=\"background: #ffffff; border: 1px solid #dbe4f0; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: 'Secular One', 'Assistant', sans-serif; font-size: 30px; color: #1f5f9e\">03<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 20px; font-weight: 700\">הטמעה<\u002Fh3>\n<p style=\"margin: 0; color: #46546f; font-size: 17px\">הדרכה פשוטה לכם ולצוות, עד שכולם מרגישים בנוח.<\u002Fp>\n<\u002Fli>\n<li style=\"background: #14213d; color: #ffffff; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: 'Secular One', 'Assistant', sans-serif; font-size: 30px; color: #8fb8e6\">04<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 20px; font-weight: 700\">ליווי שוטף<\u002Fh3>\n<p style=\"margin: 0; color: #d6e2f2; font-size: 17px\">המערכת לא נשארת לבד. מתחזקים, משפרים ועונים על כל שאלה.<\u002Fp>\n<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"faq\" style=\"background: #ffffff\">\n<div style=\"max-width: 820px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 28px\">\n<h2 style=\"margin: 0; font-family: 'Secular One', 'Assistant', sans-serif; font-weight: 400; font-size: 38px; line-height: 1.2\">שאלות שבעלי עסקים שואלים.<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n\n<div style=\"border: 1px solid #dbe4f0; border-radius: 16px; overflow: hidden\">\n<button type=\"button\" style=\"width: 100%; min-height: 60px; padding: 16px 20px; border: 0; background: ; display: flex; justify-content: space-between; align-items: center; gap: 16px; text-align: right; font: 700 18px 'Assistant', sans-serif; color: #14213d; cursor: pointer\">\n<span>{{item.q}}<\u002Fspan>\n<span aria-hidden=\"true\" style=\"font-size: 24px; color: #1f5f9e\">{{item.sign}}<\u002Fspan>\n<\u002Fbutton>\n\n<p style=\"margin: 0; padding: 0 20px 20px; color: #46546f; background: #f5f8fc\">{{item.a}}<\u002Fp>\n\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #14213d; color: #ffffff\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px\">\n<h2 style=\"margin: 0; font-family: 'Secular One', 'Assistant', sans-serif; font-weight: 400; font-size: 42px; line-height: 1.2\">השאלה היא לא אם. השאלה היא מתי.<\u002Fh2>\n<p style=\"margin: 0; color: #d6e2f2; font-size: 20px; max-width: 560px\">שלחו לנו הודעה באינסטגרם, ונשלח לכם שאלון התאמה קצר. בלי התחייבות.<\u002Fp>\n<a href=\"https://www.instagram.com/almarisystems/\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; min-height: 52px; padding: 0 30px; border-radius: 999px; background: #ffffff; color: #14213d; font-weight: 700; font-size: 18px; text-decoration: none\">לעמוד האינסטגרם<\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background: #0e1830; color: #b9c8de\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 28px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; font-size: 15px\">\n<div style=\"font-family: 'Secular One', 'Assistant', sans-serif; color: #ffffff; letter-spacing: 0.04em\">ALMARI SYSTEMS<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px\">\n<a href=\"https://www.instagram.com/almarisystems/\" target=\"_blank\" rel=\"noopener\" style=\"color: #d6e2f2\">אינסטגרם @almarisystems<\u002Fa>\n<a href=\"mailto:almarisystems@gmail.com\" style=\"color: #d6e2f2\">almarisystems@gmail.com<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1f5f9e&quot;,&quot;options&quot;:[&quot;#1f5f9e&quot;,&quot;#2a7ab8&quot;,&quot;#14213d&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:4600}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { mode: 'manual', hours: 6, openFaq: 0 };\n  }\n  renderVals() {\n    const auto = this.state.mode === 'auto';\n    const steps = [\n      ['הודעה נכנסת', 'מישהו צריך לראות אותה ולענות כשמתפנה', 'מענה מיידי יוצא לבד, גם בערב'],\n      ['רישום הפרטים', 'מעתיקים שם, טלפון ובקשה לטבלה', 'הפרטים נכנסים לטבלה לבד'],\n      ['הצעת מחיר', 'מקלידים שוב את אותם פרטים לקובץ', 'הצעה מוכנה מתבנית, נשלחת בלחיצה'],\n      ['מעקב', 'פתק או תזכורת, ולפעמים שוכחים', 'הודעת מעקב יוצאת בזמן, אוטומטית']\n    ];\n    const flow = steps.map((s, i) => ({\n      n: i + 1,\n      title: s[0],\n      text: auto ? s[2] : s[1],\n      bg: auto ? '#e8f1fb' : '#f6f6f4',\n      dot: auto ? '#1f5f9e' : '#8a94a6'\n    }));\n    const hours = this.state.hours;\n    const faqData = [\n      ['אנחנו לא מבינים בטכנולוגיה. זה מתאים לנו?', 'בדיוק בשבילכם. את כל הצד הטכני אנחנו לוקחים עלינו. אתם צריכים רק לספר לנו איך העסק עובד.'],\n      ['מה קורה אם משהו מפסיק לעבוד?', 'אנחנו מלווים גם אחרי ההטמעה. פונים אלינו, ואנחנו מטפלים.'],\n      ['צריך לקנות תוכנות חדשות?', 'ככל האפשר בונים על הכלים שכבר יש לעסק. אם צריך כלי נוסף, נסביר מראש למה ומה העלות.'],\n      ['כמה זמן לוקח להקים מערכת?', 'זה תלוי בהיקף. אחרי האבחון תקבלו לוח זמנים מסודר.']\n    ];\n    const faqs = faqData.map((f, i) => {\n      const open = this.state.openFaq === i;\n      return {\n        q: f[0], a: f[1], open,\n        expanded: open ? 'true' : 'false',\n        sign: open ? '−' : '+',\n        bg: open ? '#f5f8fc' : '#ffffff',\n        toggle: () => this.setState({ openFaq: open ? -1 : i })\n      };\n    });\n    return {\n      accent: this.props.accent ?? '#1f5f9e',\n      flow,\n      showManual: () => this.setState({ mode: 'manual' }),\n      showAuto: () => this.setState({ mode: 'auto' }),\n      manualPressed: auto ? 'false' : 'true',\n      autoPressed: auto ? 'true' : 'false',\n      manualBg: auto ? 'transparent' : '#14213d',\n      manualFg: auto ? '#14213d' : '#ffffff',\n      autoBg: auto ? '#1f5f9e' : 'transparent',\n      autoFg: auto ? '#ffffff' : '#14213d',\n      summary: auto ? 'אותו לקוח. אפס העתקות. אתם רק מאשרים.' : 'ארבע פעולות ידניות על כל לקוח.',\n      summaryColor: auto ? '#1f5f9e' : '#6b4a3a',\n      hours,\n      onHours: (e) => this.setState({ hours: Number(e.target.value) }),\n      yearly: hours * 52,\n      days: Math.round(hours * 52 / 9),\n      faqs\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
